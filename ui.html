<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SemanticSearch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151a;
    --panel:#181c22;
    --panel-2:#1e232b;
    --border:#2a303a;
    --border-soft:#333a45;
    --text:#dfe3e8;
    --text-dim:#8b93a1;
    --text-faint:#5a6270;
    --accent:#63b3ed;
    --accent-dim:#2c5a82;
    --score:#68d8c9;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{
    min-height:100%;
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    /* page-level scroll — results grow the page, user scrolls naturally */
    overflow-y:auto;
    overflow-x:hidden;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  button{ font-family:inherit; }

  /* Top bar: logo pinned top-left, full viewport width */
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 28px;
    background:rgba(18,21,26,0.88);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .brand .mark{ color:var(--accent); flex-shrink:0; }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand .word{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    letter-spacing:-.2px;
  }

  /* Main content area — full width, generous horizontal padding */
  .app{
    width:100%;
    padding:24px 28px;
    padding-bottom:60px;
  }

  .stage{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* live status label in topbar */
  .toplabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:16px;
  }
  .toplabel .dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--score);
    box-shadow:0 0 0 0 rgba(94,234,212,.5);
    animation:pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%  { box-shadow:0 0 0 0   rgba(94,234,212,.4); }
    70% { box-shadow:0 0 0 5px rgba(94,234,212,0); }
    100%{ box-shadow:0 0 0 0   rgba(94,234,212,0); }
  }

  /* search bar */
  .searchbar{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    transition:border-color .18s ease, box-shadow .18s ease;
    flex-shrink:0;
  }
  .searchbar:focus-within{
    border-color:var(--accent-dim);
    box-shadow:0 0 0 3px rgba(138,162,255,0.1);
  }
  .searchbar svg{ width:16px; height:16px; color:var(--text-faint); flex-shrink:0; }
  .searchbar input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:14px;
    font-family:'Inter',sans-serif;
    min-width:0;
  }
  .searchbar input::placeholder{ color:var(--text-faint); }
  .kbd{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
    border:1px solid var(--border);
    padding:2px 6px;
    border-radius:4px;
    flex-shrink:0;
  }

  /* controls row */
  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .control{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .control .clabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .switch{
    all:unset;
    width:32px; height:18px;
    border-radius:10px;
    background:var(--border-soft);
    border:1px solid var(--border);
    position:relative;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease;
    flex-shrink:0;
  }
  .switch .knob{
    position:absolute;
    top:2px; left:2px;
    width:12px; height:12px;
    border-radius:50%;
    background:var(--text-faint);
    transition:transform .18s ease, background .18s ease;
  }
  .switch.on{ background:rgba(138,162,255,0.15); border-color:var(--accent-dim); }
  .switch.on .knob{ transform:translateX(14px); background:var(--accent); }

  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    border:1px solid var(--border);
    border-radius:7px;
    overflow:hidden;
  }
  .stepper button{
    all:unset;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    cursor:pointer;
    font-size:13px;
    line-height:1;
  }
  .stepper button:hover{ background:var(--panel-2); color:var(--text); }
  .stepper .kval{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text);
    width:22px;
    text-align:center;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
    height:22px;
    display:flex; align-items:center; justify-content:center;
  }

  .controls-right{ margin-left:auto; }

  /* file dock */
  .filedock{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .filedock::-webkit-scrollbar{ display:none; }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 6px 5px 9px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .chip svg{ width:11px; height:11px; color:var(--text-faint); flex-shrink:0; }
  .chip .fname{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chip .fmeta{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--text-faint);
  }
  .chip .rm{
    all:unset;
    cursor:pointer;
    color:var(--text-faint);
    width:14px; height:14px;
    display:flex; align-items:center; justify-content:center;
    border-radius:3px;
    flex-shrink:0;
  }
  .chip .rm:hover{ color:#e8899a; background:rgba(232,137,154,0.1); }
  .addfile{
    all:unset;
    display:flex;
    align-items:center;
    gap:5px;
    border:1px dashed var(--border-soft);
    border-radius:6px;
    padding:5px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    cursor:pointer;
    flex-shrink:0;
    transition:border-color .15s ease, color .15s ease;
  }
  .addfile:hover{ border-color:var(--accent-dim); color:var(--accent); }

  /* RAG answer box — no inner scroll, grows with content */
  .answerbox{
    background:linear-gradient(180deg, rgba(99,179,237,0.07), rgba(99,179,237,0.02));
    border:1px solid var(--accent-dim);
    border-radius:9px;
    padding:14px 16px;
    display:none;
    flex-direction:column;
    gap:8px;
  }
  .answerbox.show{ display:flex; }
  .answerbox .atitle{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--accent);
    letter-spacing:.3px;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  .answerbox .atext{
    font-size:13px;
    line-height:1.6;
    color:var(--text);
  }
  .answerbox .atext code{
    background:var(--panel-2); padding:1px 5px; border-radius:3px;
    font-family:'IBM Plex Mono',monospace; font-size:.82em; color:var(--score);
  }
  .answerbox .acites{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
    flex-shrink:0;
  }
  .answerbox .acites b{ color:var(--text-dim); font-weight:500; }

  /* streaming dots inside answer */
  .adots{ display:flex; gap:4px; align-items:center; }
  .adot { width:5px; height:5px; background:var(--accent-dim); border-radius:50%; animation:bob 1.1s ease-in-out infinite; }
  .adot:nth-child(2){ animation-delay:.15s; }
  .adot:nth-child(3){ animation-delay:.30s; }
  @keyframes bob{ 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

  /* results meta */
  .results-meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
  }
  .results-meta .val{ color:var(--text-dim); }

  /* results — no inner scroll, page scrolls naturally */
  .results{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  /* ── Result card ─────────────────────────────────────────── */
  .result{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 8px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    opacity:0;
    animation:rise .35s ease forwards;
    transition:background .15s ease, border-color .15s ease;
  }
  .result:hover{
    background:var(--panel-2);
    border-color:var(--border);
  }
  .result.expanded{
    background:var(--panel);
    border-color:var(--border-soft);
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(4px); }
    to  { opacity:1; transform:translateY(0); }
  }
  .result-main{ flex:1; min-width:0; }
  .result-title{
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result.expanded .result-title{
    white-space:normal;
    overflow:visible;
    text-overflow:unset;
  }
  .result-path{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:2px;
  }
  /* Snippet: 2-line clamp when collapsed, full text when expanded */
  .result-snippet{
    font-size:12px;
    color:var(--text-dim);
    margin-top:5px;
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .result.expanded .result-snippet{
    display:block;
    overflow:visible;
    -webkit-line-clamp:unset;
  }
  /* Expand/collapse hint shown on hover or when expanded */
  .result-expand-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--text-faint);
    margin-top:5px;
    display:none;
  }
  .result:hover .result-expand-hint,
  .result.expanded .result-expand-hint{ display:block; }
  .result.expanded .result-expand-hint::before{ content:'\25B2  collapse'; }
  .result:not(.expanded) .result-expand-hint::before{ content:'\25BC  expand full text'; }

  .score{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--score);
    flex-shrink:0;
    width:34px;
    text-align:right;
    padding-top:2px;
  }

  /* empty / status */
  .empty-msg{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    gap:8px;
    padding:20px;
    min-height:80px;
  }

  @media (max-width:600px){
    .topbar{ padding:10px 16px; }
    .app{ padding:16px; }
    .result-path{ display:none; }
    .control .clabel{ display:none; }
  }
</style>
</head>
<body>

<!-- sticky top bar: logo top-left + live status label -->
<header class="topbar">
  <div class="brand">
    <svg class="mark" width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle cx="9"  cy="9"  r="6" fill="currentColor" opacity="0.9"/>
      <circle cx="16" cy="10" r="5" fill="currentColor" opacity="0.55"/>
      <circle cx="12" cy="17" r="4" fill="currentColor" opacity="0.3"/>
    </svg>
    <span class="word">SemanticSearch</span>
  </div>
  <div class="toplabel">
    <span class="dot"></span>
    <span id="label-text">semantic search &middot; ready</span>
  </div>
</header>

<!-- main content -->
<div class="app">
  <div class="stage">

    <!-- search bar -->
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input id="q" type="text" placeholder="Ask about your documents&hellip;" autocomplete="off">
      <span class="kbd mono">&#x23CE; Enter</span>
    </div>

    <!-- controls row -->
    <div class="controls">
      <div class="control">
        <button class="switch on" id="ragSwitch" role="switch" aria-checked="true"><span class="knob"></span></button>
        <span class="clabel">RAG answer</span>
      </div>
      <div class="control">
        <span class="clabel">k =</span>
        <div class="stepper">
          <button id="kMinus">&#8722;</button>
          <div class="kval mono" id="kVal">5</div>
          <button id="kPlus">&#43;</button>
        </div>
      </div>
      <div class="control controls-right">
        <span class="clabel mono" id="fileCount">0 sources</span>
      </div>
    </div>

    <!-- file dock -->
    <div class="filedock" id="filedock">
      <button class="addfile" id="addFileBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        add files
      </button>
    </div>
    <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md,.docx,.doc,.xlsx,.xls,.pptx,.ppt,.csv,.html,.htm" style="display:none">

    <!-- RAG answer box -->
    <div class="answerbox" id="answerBox">
      <div class="atitle">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>
        RAG ANSWER
      </div>
      <div id="answerBody"></div>
      <div class="acites" id="answerCites"></div>
    </div>

    <!-- results meta -->
    <div class="results-meta" id="resultsMeta" style="display:none">
      <span>top <span class="val" id="kEcho">5</span> results</span>
      <span id="timingEcho"></span>
    </div>

    <!-- results -->
    <div class="results" id="results">
      <div class="empty-msg">Add files above, then ask anything.</div>
    </div>

  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────
const S = {
  k:       5,
  ragOn:   true,
  files:   [],      // [{id, filename, n_chunks, uploaded_at}]
  busy:    false,
  pending: [],
};

// ── Helpers ──────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function csrfHdr() {
  const t = getCookie('csrf');
  return t ? { 'X-CSRF-Token': t } : {};
}
async function api(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: { ...csrfHdr() } };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(e.detail || 'Request failed');
  }
  return r.json();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function md(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,     '<em>$1</em>')
    .replace(/`([^`]+)`/g,     '<code>$1</code>')
    .replace(/\n/g,            '<br>');
}

// ── Boot: silent guest session ───────────────────────────────
(async () => {
  try { await api('GET', '/api/auth/me'); }
  catch { try { await api('POST', '/api/auth/guest'); } catch(e) { console.error('Auth failed', e); } }
  await loadFiles();
})();

// ── RAG toggle ───────────────────────────────────────────────
const ragSwitch = $('ragSwitch');
function setRag(on) {
  S.ragOn = on;
  ragSwitch.classList.toggle('on', on);
  ragSwitch.setAttribute('aria-checked', String(on));
  if (!on) hideAnswer();
}
ragSwitch.addEventListener('click', () => setRag(!S.ragOn));

// ── k stepper ────────────────────────────────────────────────
let k = 5;
const kValEl = $('kVal');
$('kMinus').addEventListener('click', () => { k = Math.max(1, k - 1); kValEl.textContent = k; });
$('kPlus').addEventListener('click',  () => { k = Math.min(20, k + 1); kValEl.textContent = k; });

// ── File dock ────────────────────────────────────────────────
const filedock   = $('filedock');
const addFileBtn = $('addFileBtn');
const fileInput  = $('fileInput');

addFileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const chosen = Array.from(fileInput.files);
  if (!chosen.length) return;
  addFileBtn.textContent = 'Uploading\u2026';
  addFileBtn.disabled = true;
  const fd = new FormData();
  chosen.forEach(f => fd.append('files', f));
  try {
    await api('POST', '/api/files', fd);
    await loadFiles();
  } catch(e) {
    console.error('Upload error', e);
  } finally {
    fileInput.value = '';
    addFileBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> add files';
    addFileBtn.disabled = false;
  }
});

async function loadFiles() {
  try { S.files = await api('GET', '/api/files'); }
  catch(e) { console.error('loadFiles', e); }
  renderChips();
}

function renderChips() {
  // remove existing chips (not the addFileBtn)
  filedock.querySelectorAll('.chip').forEach(c => c.remove());

  S.files.forEach(f => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.id = f.id;
    chip.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
        '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>' +
        '<path d="M14 2v6h6"/>' +
      '</svg>' +
      '<span class="fname">' + esc(f.filename) + '</span>' +
      '<span class="fmeta">' + f.n_chunks + 'ch</span>' +
      '<button class="rm" data-id="' + f.id + '" title="Remove">' +
        '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button>';
    filedock.insertBefore(chip, addFileBtn);
  });

  // update file count label
  const n = S.files.length;
  $('fileCount').textContent = n + ' source' + (n !== 1 ? 's' : '');

  // wire remove buttons
  filedock.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = parseInt(e.currentTarget.dataset.id);
      try { await api('DELETE', '/api/files/' + id); await loadFiles(); }
      catch(err) { console.error('Delete failed', err); }
    });
  });
}

// ── Search ───────────────────────────────────────────────────
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSearch(); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('q').focus(); }
});

async function doSearch() {
  const q = $('q').value.trim();
  if (!q || S.busy) return;
  S.busy = true;

  const t0 = performance.now();
  $('label-text').textContent = 'searching\u2026';
  $('results').innerHTML = '';
  $('resultsMeta').style.display = 'none';
  hideAnswer();
  if (S.ragOn) showAnswerLoading();

  const fileIds = S.files.map(f => f.id);
  const mode    = S.ragOn ? 'rag' : 'search';

  try {
    const resp = await fetch('/api/query', {
      method: 'POST',
      credentials: 'same-origin',
      headers: Object.assign({ 'Content-Type': 'application/json' }, csrfHdr()),
      body: JSON.stringify({ question: q, file_ids: fileIds, mode: mode, history: [], k: k }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let answerText = '';
    let sources = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();

      for (const block of parts) {
        const line = block.trim();
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }

        if (data.type === 'sources') {
          sources = data.sources || [];
          renderResults(sources);
          const ms = Math.round(performance.now() - t0);
          $('kEcho').textContent = Math.min(sources.length, k);
          $('timingEcho').textContent = ms + 'ms';
          $('resultsMeta').style.display = sources.length ? '' : 'none';
        }
        else if (data.type === 'token' && S.ragOn) {
          answerText += data.text;
          $('answerBox').classList.add('show');
          $('answerBody').innerHTML = '<div class="atext">' + esc(answerText) + '</div>';
        }
        else if (data.type === 'done') {
          if (S.ragOn && answerText) {
            $('answerBody').innerHTML = '<div class="atext">' + md(answerText) + '</div>';
            if (sources.length) {
              // sources.length is exactly k — the server respects the k we sent
              const uniqueFiles = [...new Set(sources.map(s => s.filename))];
              $('answerCites').innerHTML =
                'grounded in <b>' + sources.length + '</b> chunk' + (sources.length !== 1 ? 's' : '') +
                ' from ' + uniqueFiles.map(f => esc(f)).join(', ');
            }
          } else if (!S.ragOn) {
            hideAnswer();
          }
        }
        else if (data.type === 'error') {
          $('answerBody').innerHTML = '<div class="atext" style="color:#e8899a">' + esc(data.text) + '</div>';
        }
      }
    }
  } catch(e) {
    $('results').innerHTML = '<div class="empty-msg">Error: ' + esc(e.message) + '</div>';
    hideAnswer();
  } finally {
    S.busy = false;
    $('label-text').textContent = 'semantic search \u00b7 ready';
  }
}

function renderResults(sources) {
  const el = $('results');
  const shown = sources.slice(0, k);
  if (!shown.length) {
    el.innerHTML = '<div class="empty-msg">No matching results found.</div>';
    return;
  }
  el.innerHTML = '';
  shown.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'result';
    div.style.animationDelay = (i * 55) + 'ms';
    // Show the FULL chunk text — no artificial truncation
    const fullText = s.text ? esc(s.text) : '';
    const loc      = s.location ? ' &middot; ' + esc(s.location) : '';
    const scoreVal = typeof s.score === 'number' ? s.score.toFixed(2) : '';
    let scoreTip = '';
    if (typeof s.raw_rerank_score === 'number') {
      scoreTip = 'Re-rank relevance: ' + s.score.toFixed(3) + (typeof s.vec_score === 'number' ? ' (Vector cosine: ' + s.vec_score.toFixed(2) + ')' : '');
    } else if (typeof s.vec_score === 'number') {
      scoreTip = 'Hybrid score: ' + s.score.toFixed(2) + ' (Vector cosine: ' + s.vec_score.toFixed(2) + ')';
    }
    div.innerHTML =
      '<div class="result-main">' +
        '<div class="result-title">' + esc(s.filename) + '</div>' +
        '<div class="result-path mono">' + esc(s.filename) + loc + '</div>' +
        (fullText
          ? '<div class="result-snippet">' + fullText + '</div>' +
            '<div class="result-expand-hint"></div>'
          : '') +
      '</div>' +
      '<div class="score mono"' + (scoreTip ? ' title="' + esc(scoreTip) + '"' : '') + '>' + scoreVal + '</div>';
    // Toggle expanded class on click to reveal full text
    div.addEventListener('click', () => div.classList.toggle('expanded'));
    el.appendChild(div);
  });
}

function showAnswerLoading() {
  $('answerBox').classList.add('show');
  $('answerBody').innerHTML = '<div class="adots"><div class="adot"></div><div class="adot"></div><div class="adot"></div></div>';
  $('answerCites').textContent = '';
}
function hideAnswer() {
  $('answerBox').classList.remove('show');
  $('answerBody').innerHTML = '';
  $('answerCites').textContent = '';
}
</script>
</body>
</html>
